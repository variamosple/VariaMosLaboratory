# SonarCloud analysis run by the CI (build-and-test), with the coverage of
# the Jest tests of react-scripts; automatic analysis is off. Files are
# listed one by one, so that nothing else of the repository is sent.
sonar.organization=variamosple-1
sonar.projectKey=variamosple_VariaMosLaboratory

sonar.sources=src,etc,Dockerfile,.github
sonar.tests=src,e2e
sonar.exclusions=src/**/*.test.ts,src/**/*.test.tsx
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx,e2e/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info
