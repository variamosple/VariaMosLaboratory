name: Frontend CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: 'npm'
        cache-dependency-path: package-lock.json

    # The lock file was written with peer dependency conflicts (React 18 and older packages)
    - name: Install dependencies
      run: npm ci --legacy-peer-deps

    - name: Type check
      run: npx tsc --noEmit -p .

    - name: Tests
      run: npx react-scripts test --watchAll=false
      env:
        CI: true

    # With CI=true, react-scripts would fail the build on lint warnings inherited from the template
    - name: Production build
      run: npx react-scripts build
      env:
        CI: false
